<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieVerse Ingestion Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="nav-container">
        <h1 class="logo">🎬 MovieVerse</h1>
        <span class="subtitle">Ingestion Dashboard</span>
      </div>
    </div>

    <div class="main-container">
      <div class="kpi-section">
        <div class="kpi-card">
          <div class="kpi-label">Today's Total</div>
          <div class="kpi-value" id="todayCount">--</div>
          <div class="kpi-date" id="todayDate">Loading...</div>
        </div>
      </div>

      <div class="content-section">
        <div class="controls-header">
          <div>
            <label for="dateSelect">Select Date:</label>
            <select id="dateSelect" class="date-select"></select>
          </div>
        </div>

        <div id="summary" class="summary-text"></div>

        <div class="table-wrapper">
          <table id="moviesTable" class="movies-table">
            <thead>
              <tr>
                <th>Movie ID</th>
                <th>Title</th>
                <th>Release Date</th>
                <th>Extracted At</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/static/app.js?v=7"></script>
  </body>
</html>
