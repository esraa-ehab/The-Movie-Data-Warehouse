          combination_of_columns:
            - movie_id
            - cast_member_id
    columns:
      - name: movie_id
        description: "Foreign key referencing the parent movie record."
        tests:
          - not_null
          - relationships:
              to: ref('stg_movies')
              field: movie_id 
      - name: cast_member_id
        description: "The unique identifier for the unnested cast member."
        tests:
          - not_null 

