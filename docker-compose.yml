version: '3.8'

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    PYTHONPATH: /opt/airflow

    # ── project's env vars ───────────────────────────────────────────
    TMDB_API_KEY: ${TMDB_API_KEY}
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: ${DB_HOST}   
    DB_PORT: ${DB_PORT}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./tmdwh:/opt/airflow/tmdwh
  user: "${AIRFLOW_UID}:0"
  networks:
    - movieverse-network
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  movie-postgres:
    image: postgres:18
    container_name: movie-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - movieverse_data:/var/lib/postgresql/data
    restart: always
    networks:
      - movieverse-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      retries: 5

  # ── Airflow's own internal metadata database ──────────────────────────────
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    networks:
      - movieverse-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # ── Superset's own internal metadata database ──────────────────────────────
  superset-postgres:
    image: postgres:15
    container_name: superset-postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      retries: 5
    restart: always
    networks:
      - movieverse-network

  # ── One-time init ─────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: "no"

  # ── Webserver ─────────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ── Scheduler ─────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # ── Jenkins CI/CD Server ──────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:latest
    container_name: jenkins-server
    privileged: true
    user: root
    ports:
      - "8081:8080" 
      - "50000:50000" 
    volumes:
      - jenkins-data-volume:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock 
    networks:
      - movieverse-network
    restart: always

  # ── Apache Superset ─────────────────────────────────────────────────────────────
  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: movieverse_secret_key
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-postgres:5432/superset
    depends_on:
      superset-postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin \
      --username admin \
      --firstname Admin \
      --lastname User \
      --email admin@example.com \
      --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "
    volumes:
      - superset-home:/app/superset_home
    restart: always
    networks:
      - movieverse-network

networks:
  movieverse-network:
    external: true  

volumes:
  airflow-db-volume:
  jenkins-data-volume:
  superset-db-volume:
  superset-home:
  movieverse_data:
    external: true